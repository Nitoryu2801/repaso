<section>
  <h2>{{ 'CATALOGUE.TITLE' | translate }}</h2>

  <mat-button-toggle-group
    [value]="store.selectedTerm()"
    (change)="onFilterChange($event.value)"
    class="filter-group">
    <mat-button-toggle value="phone">{{ 'CATALOGUE.PHONE' | translate }}</mat-button-toggle>
    <mat-button-toggle value="laptop">{{ 'CATALOGUE.LAPTOP' | translate }}</mat-button-toggle>
  </mat-button-toggle-group>

  <div *ngIf="store.loading()" class="spinner-container">
    <mat-spinner diameter="40"></mat-spinner>
  </div>

  <div *ngIf="!store.loading()" class="products-grid">
    <app-product-card
      *ngFor="let item of store.products()"
      [product]="item">
    </app-product-card>
  </div>
</section>
